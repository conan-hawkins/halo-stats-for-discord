# Build the bot image here, not on the server.
#
# The server has 7.6GB of RAM and already runs this bot, the API and a ~64GB
# SQLite database on the same disk. halo-stack's README has said since the web
# image moved to CI that building there "took the whole server down" - and on
# 2026-09-04 a run of on-box bot rebuilds did exactly that again: sshd kept
# accepting TCP on :22 but stopped completing handshakes, while the containers
# already running carried on serving. It needed a physical restart.
#
# That rule was written about the web image but it is really about the BOX. It
# applies here for the same reason, plus one of its own: this repo's build
# context is a directory that also holds a 64GB database, and only
# .dockerignore keeps `docker build` from streaming it at the daemon. A CI
# checkout has no data/ at all, so that failure mode cannot happen here.
#
# So: GitHub builds and publishes, the server pulls. deploy.sh still falls back
# to a local build if the pull fails, so a registry outage cannot strand it.
name: Publish bot image

on:
  push:
    # This repo's default branch is master, not main. Do not assume.
    branches: [master]
    # An allowlist would be wrong here: the Dockerfile does `COPY . .`, so
    # anything not in .dockerignore lands in the image. Ignore only what
    # provably cannot - documentation and the test suite.
    paths-ignore:
      - "**/*.md"
      - "bot_docs/**"
      - "tests/**"
  # So the image can be rebuilt without an empty commit.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Scoped to this workflow run; no PAT to manage or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest is what the server pulls; the sha tag is what makes a
          # rollback possible without rebuilding.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
